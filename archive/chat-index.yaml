    target: chapter_01
    status: completed
    dossier: recovered/manuscript/chapter-01-prompt-397.md
    action: >-
      Prompt 397 wurde wörtlich gesichert und mit dem aktuellen Manuskript
      verglichen. Eine unmittelbar folgende Absatzanalyse ist im Chat nicht
      vorhanden; dieser negative Quellenbefund ist im Dossier dokumentiert.
  - priority: 2
    target: chapters_16_17_and_conclusion
    status: completed
    inventory: recovered/manuscript/README.md
    dossiers:
      - recovered/manuscript/chapter-16-answer-391.md
      - recovered/manuscript/chapter-17-answer-392.md
      - recovered/manuscript/conclusion-answer-393.md
    action: >-
      Je eine vollständige Fassung wurde als Assistentenentwurf isoliert. Frühere
      Architekturvarianten sind im Inventar getrennt verzeichnet; eine
      Autorenbestätigung der einzelnen Formulierungen steht noch aus.
  - priority: 3
    target: chapters_01_to_15
    status: completed
    map: recovered/manuscript/chapters-01-15-map.md
    inventory: recovered/manuscript/README.md
    action: >-
      Dreizehn Vollentwürfe wurden wortgetreu einzeln gesichert. Für die nicht
      vollständig vorliegenden aktuellen Kapitel 5 und 10 wurden getrennte
      Materialdossiers mit ihren Rohfassungen und dem Integrationsauftrag angelegt.
  - priority: 4
    target: research_and_montage
    action: >-
      Chatformulierungen zu Forschung, Variantenbildung und Montage mit den
      Original-PDFs und den seitenbezogenen Evidenzdateien abgleichen.