  manuscript_changed: false
  source_status:
    requested_source: "text.md"
    availability: "unavailable_removed_for_privacy"
    restoration_attempted: false
    substituted_sources:
      - "archive/chats/book-chat.user-prompts.md"
      - "archive/chats/book-chat.assistant-answers.redacted.md"
      - "archive/chat-index.yaml"
      - "recovered/manuscript/"
    private_material_consulted: false
    excluded_chat_sections:
      - "Prompts 1–103"
      - "Prompt 107"
  authority_note: >-
    Der nicht private Chatverlauf ist eine historische Quelle, aber nicht
