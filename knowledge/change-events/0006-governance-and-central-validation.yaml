schema_version: 1
id: change-governance-and-central-validation
created_at: 2026-07-30
goal: >-
  Die Verfassung als erste verbindliche Kontextinstanz in allen maßgeblichen
  Arbeitsanweisungen verankern und die vorhandenen Einzelprüfungen in einem
  reproduzierbaren lokalen und CI-fähigen Gesamtbefehl zusammenführen.
operation: reorganization
scope:
  allowed_files:
    - AGENTS.md
    - WORKFLOW.md
    - .agents/skills/recursive-codex/SKILL.md
    - scripts/check_all.py
    - .github/workflows/validate.yml
    - knowledge/change-events/0006-governance-and-central-validation.yaml
    - projekt/arbeitsstand.md
  protected_files:
    - CONSTITUTION.md
    - PROJECT.md
    - GLOSSAR.md
    - manuskript/
    - knowledge/concepts/
    - knowledge/decisions/
    - interaktiv/
basis:
  project_files:
    - CONSTITUTION.md
    - AGENTS.md
    - WORKFLOW.md
    - .agents/skills/recursive-codex/SKILL.md
    - .agents/skills/recursive-codex/scripts/check_recursive_state.py
    - .codex/hooks/recursive_stop.py
    - .github/workflows/validate.yml
    - requirements-dev.txt
    - interaktiv/package.json
  decisions:
    - decision-0021
  sources:
    - "Repository review supplied by the author on 2026-07-30"
changes:
  - file: AGENTS.md
    summary: CONSTITUTION.md als ersten verbindlichen Kontext vor jeder größeren Änderung ergänzt.
  - file: WORKFLOW.md
    summary: Das verpflichtende Kontextlesen mit Verfassung und geltender Autoritätshierarchie eröffnet.
  - file: .agents/skills/recursive-codex/SKILL.md
    summary: Die Aufnahme des verbindlichen Kontexts beginnt nun ausdrücklich mit CONSTITUTION.md.
  - file: scripts/check_all.py
    summary: Einen plattformübergreifenden Gesamtbefehl für Wissens-, Change-Event-, Recursive-, MCP-, Hook-, JavaScript-, Test- und Buildprüfungen ergänzt.
  - file: .github/workflows/validate.yml
    summary: Die vorhandene Wissensprüfung zu einer vollständigen Push- und Pull-Request-Prüfung mit Python- und Node-Abhängigkeiten erweitert.
  - file: knowledge/change-events/0006-governance-and-central-validation.yaml
    summary: Governanceänderung, Prüfbeziehungen, offene Autoritätsfrage und Validierung dokumentiert.
  - file: projekt/arbeitsstand.md
    summary: Verfassungsbindung, zentralen Prüfbefehl und verbleibende Autorenentscheidung festgehalten.
affected_relations:
  - from: AGENTS.md
    relation: depends_on
    to: CONSTITUTION.md
    effect: added
    note: Größere Änderungen sollen zuerst an der geltenden Autoritätshierarchie ausgerichtet werden.
  - from: WORKFLOW.md
    relation: depends_on
    to: CONSTITUTION.md
    effect: added
    note: Das Kontextlesen soll mit der Verfassung und nicht erst mit nachgeordneten Projektdateien beginnen.
  - from: .agents/skills/recursive-codex/SKILL.md
    relation: depends_on
    to: CONSTITUTION.md
    effect: added
    note: Der Skill soll die höchste projektinterne Instanz ausdrücklich vor allen weiteren Kontextdateien lesen.
  - from: .github/workflows/validate.yml
    relation: tests
    to: scripts/check_all.py
    effect: changed
    note: Pushes und Pull Requests sollen denselben zentralen Gesamtbefehl wie die lokale Abschlussprüfung ausführen.
possibilities:
  opened:
    - Lokale und entfernte Prüfungen können mit einem identischen Befehl reproduziert werden.
    - Künftige größere Änderungen beginnen ausdrücklich mit der geltenden Autoritätshierarchie.
  restricted:
    - Eine grüne Wissensvalidierung darf nicht mehr als Nachweis aller vorhandenen technischen Prüfungen erscheinen.
    - Die offene Hierarchiefrage einer neuen Entscheidung gegenüber noch nicht synchronisierten höherrangigen Dateien darf nicht stillschweigend gelöst werden.
  deferred:
    - Eine Autorenentscheidung zur Wirkung neuer akzeptierter Entscheidungen auf noch nicht aktualisierte Architektur- oder Glossardateien.
    - Härtung des Change-Event-Schemas und Sichtbarkeit nicht blockierender Hook-Warnungen.
    - Abbau oder explizite Modellierung der 24 bekannten Wissensreferenzwarnungen.
uncertainties:
  - GitHub Actions kann erst nach einem Push in der entfernten Umgebung tatsächlich beobachtet werden.
agent_findings:
  genealogist: []
  consistency_checker:
    - Die drei verbindlichen Kontextlisten verweisen nun übereinstimmend zuerst auf CONSTITUTION.md; nachgeordnete Dateien bleiben in ihrer bisherigen Reihenfolge erhalten.
  critic:
    - Der Gesamtbefehl prüft deklarierte und technische Konsistenz, aber weder philosophische Vollständigkeit noch wissenschaftliche Publikationsreife.
    - Die Wirkung einer neuen akzeptierten Entscheidung auf noch nicht synchronisierte höherrangige Dateien bleibt eine ausdrückliche Autorenfrage und wurde nicht technisch vorentschieden.
  material_technical:
    - Die zentrale Prüfung verwendet dieselben Befehle lokal und in GitHub Actions, installiert reproduzierbar aus den vorhandenen Lock- und Requirements-Dateien und bricht beim ersten Fehler ab.
    - Ein tatsächlicher GitHub-Lauf ist erst nach dem Push beobachtbar; der vollständige Befehl besteht lokal einschließlich npm ci und MCP-STDIO-Protokoll.
authority:
  requires_author_decision: true
  decision_status: accepted
  decision_reference: user-review-instruction-2026-07-30
validation:
  - check: Verbindliche Kontextlisten
    result: passed
    evidence: AGENTS.md, WORKFLOW.md und der Recursive-Codex-Skill nennen CONSTITUTION.md jeweils als ersten Kontext- und Hierarchieschritt.
  - check: Vollständiger lokaler Gesamtbefehl
    result: passed
    evidence: python scripts/check_all.py besteht einschließlich npm ci, 18 Anschlusslabor-Tests, Syntaxprüfung, Build, sechs Change Events, Wissensprüfung, Recursive State, Hook-Selbsttest und MCP-STDIO-Protokoll.
  - check: Bekannte Warnungen
    result: warning
    evidence: Die 24 bereits dokumentierten undeclarierten Begriffsreferenzen bleiben sichtbar und nicht blockierend; ihre Modellierung gehört nicht zum Umfang dieses Ereignisses.
  - check: GitHub-Workflowdefinition
    result: passed
    evidence: Der bestehende Push- und Pull-Request-Workflow richtet Python 3.12 und Node 22 ein, installiert requirements-dev.txt und delegiert vollständig an scripts/check_all.py.
  - check: Entfernter GitHub-Lauf
    result: warning
    evidence: Die Workflowausführung kann erst nach einem Push beobachtet werden und wurde daher nicht als bereits erfolgreich behauptet.
status: stabilized
