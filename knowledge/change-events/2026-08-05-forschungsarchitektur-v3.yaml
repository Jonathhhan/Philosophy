schema_version: 1
id: change-forschungsarchitektur-v3
created_at: 2026-08-05
goal: >-
  Eine lokale Version-3-Architektur für Forschungsprogramme, konkurrierende
  Experimente, Forschungspriorisierung und erkenntnisorientierte Methodenauswahl
  ergänzen, ohne Manuskript oder bestätigte Theorie autonom zu verändern.
operation: reorganization
scope:
  allowed_files:
    - projekt/forschungsarchitektur-v3.md
    - automation/research_program.py
    - automation/schemas/
    - automation/requests/
    - tests/test_research_program.py
    - scripts/check_all.py
    - knowledge/change-events/2026-08-05-forschungsarchitektur-v3.yaml
  protected_files:
    - CONSTITUTION.md
    - PROJECT.md
    - GLOSSAR.md
    - knowledge/project_binding.yaml
    - manuskript/
basis:
  project_files:
    - CONSTITUTION.md
    - AGENTS.md
    - projekt/forschungsarchitektur-v2.md
    - knowledge/project_binding.yaml
  decisions:
    - decision-0021
    - decision-0023
  sources: []
changes:
  - file: projekt/forschungsarchitektur-v3.md
    summary: Forschungsprogramme, Experimente, Research Director, Discovery Manager und Grenzen dokumentiert.
  - file: automation/research_program.py
    summary: Deterministische lokale V3-Orchestrierung mit Schreib- und Statusgrenzen ergänzt.
  - file: automation/schemas/
    summary: Maschinenlesbare JSON-Schemas für Forschungsprogramme und Experimente ergänzt.
  - file: tests/test_research_program.py
    summary: Priorisierung, Selektion, Vergleich und konstitutionelle Negativfälle geprüft.
  - file: scripts/check_all.py
    summary: V3-Tests und Beispielvalidierung in die Gesamtprüfung aufgenommen.
affected_relations:
  - from: projekt/forschungsarchitektur-v3.md
    relation: depends_on
    to: projekt/forschungsarchitektur-v2.md
    effect: added
    note: V3 ergänzt die Status- und Autoritätsgrenzen von V2, statt sie zu ersetzen.
  - from: automation/research_program.py
    relation: constrains
    to: knowledge/project_binding.yaml
    effect: added
    note: Die operative Schicht liest die Grenze als Vertrag und darf die Bindung nicht schreiben.
  - from: tests/test_research_program.py
    relation: tests
    to: automation/research_program.py
    effect: added
    note: Positive Abläufe und verbotene Bestätigung beziehungsweise Manuskriptausgabe werden geprüft.
  - from: scripts/check_all.py
    relation: tests
    to: automation/schemas/research-program.schema.json
    effect: changed
    note: Die zentrale Prüfung validiert beide V3-Beispiele.
possibilities:
  opened:
    - Mehrere Varianten eines Seeds als ein adressierbares Experiment vergleichen.
    - Offene Probleme nachvollziehbar nach vier Erkenntniskriterien priorisieren.
    - Agenten und Methoden anhand erwartbaren Erkenntnisgewinns auswählen.
  restricted:
    - Experimentausgaben bleiben auf generated/experiments begrenzt.
    - Automatische Theorie- und Manuskriptbestätigung ist technisch gesperrt.
  deferred:
    - Anbindung an einen konkreten Modell-Endpoint.
    - Autorenentscheidung über einzelne experimentelle Ergebnisse.
uncertainties:
  - Die vier Standardgewichte sind operative Gleichgewichtung und keine bestätigte Theorie der Erkenntniswerte.
agent_findings:
  genealogist: []
  consistency_checker: []
  critic: []
  material_technical: []
authority:
  requires_author_decision: false
  decision_status: not_required
  decision_reference: null
validation:
  - check: V3 unit tests
    result: passed
    evidence: Acht Unit-Tests prüfen Schemas, Priorisierung, Auswahl, Vergleich und Schutzgrenzen.
  - check: V3 example validation
    result: passed
    evidence: Beide Beispielanfragen sind gültig und die Priorisierung ist deterministisch ausführbar.
  - check: Recursive state
    result: passed
    evidence: RECURSIVE STATE VALID; 56 von 56 Change Events valide, Wissensprüfung ohne Warnung.
  - check: Python regression suite
    result: passed
    evidence: 53 Tests erfolgreich.
  - check: Complete repository validation
    result: passed
    evidence: scripts/check_all.py meldet ALL REPOSITORY CHECKS PASSED einschließlich Python-, Wissens-, Graph-, Hook- und interaktiver Tests.
status: tested
