possibilities:
  opened:
    - Theoriegeleitete Codex-Arbeit kann systematisch Widerstände, Nebenfolgen und Grenzbefunde an die Theorie zurückgeben.
    - Negative Befunde und gescheiterte Übertragungen werden als mögliche Lernresultate dokumentierbar.
  restricted:
    - Codex-Ausgaben, Validatorerfolg und operative Bewährung dürfen Theorie nicht selbst bestätigen.
  deferred:
    - Eine konkrete Manuskriptrevision aus einem diagnostischen Rückgabebefund benötigt einen eigenen Auftrag.
uncertainties: []
agent_findings:
  genealogist: []
  consistency_checker:
    - Tragfähig ist ein vermittelter doppelter Lernkreis mit Sperre zwischen operativem Befund und theoretischer Integration.
    - Negative Befunde, Nichtübertragbarkeit und Übersetzungsverluste müssen erhalten bleiben.
  critic:
    - Symmetrisches Lernen erzeugt Zirkularität, Selbstbestätigung und eine verdeckte Verschiebung von Auswahl- und Aufmerksamkeitsmacht.
    - Gegenproben sollen auch alternative Beschreibungen ohne Projektvokabular zulassen.
  material_technical: []
