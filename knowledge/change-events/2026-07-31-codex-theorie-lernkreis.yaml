        reason: Die Fassung könnte theoriegeprägte Codex-Ausgaben zirkulär als Theoriebeleg behandeln.
    deferred: []
  arrangement:
    - position: 1
      variant: asymmetric-learning
      target: projekt/codex-theorie-lernkreis.md
      function: Doppelte Bewegung, Rückübersetzungssperre und Lernprotokoll bestimmen.
    - position: 2
      variant: asymmetric-learning
      target: AGENTS.md, WORKFLOW.md und recursive-codex-Skill
      function: Lernkreis in den ausführbaren Projektablauf binden.
    - position: 3
      variant: asymmetric-learning
      target: Codex-Nutzungsanleitung und Auftragsvorlage
      function: Lernauftrag und Statusgrenzen für den Autor zugänglich machen.
  feedback:
