created_at: 2026-07-30
goal: >-
  Die KI-Schaltfläche im Anschlusslabor soll einen nicht erreichbaren API-Endpunkt
  verständlich als Konfigurations- oder Deploymentgrenze ausweisen, statt die
  technische Browsermeldung "Failed to fetch" anzuzeigen.
