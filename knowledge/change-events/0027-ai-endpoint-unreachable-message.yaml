changes:
  - file: interaktiv/js/main.js
    summary: >-
      Übersetzt Netzwerkfehler beim KI-Aufruf in eine nutzbare Meldung zur
      Erreichbarkeit von Worker oder Projektserver.
  - file: interaktiv/tests/main.test.mjs
    summary: >-
      Ergänzt einen Test für den nicht erreichbaren KI-Endpunkt und stellt sicher,
      dass der manuelle Entwurf unverändert bleibt.
  - file: interaktiv/README.md
    summary: >-
      Dokumentiert den Unterschied zwischen konfiguriertem 503-Endpunkt und
      statischer Nutzung ohne erreichbare API.
  - file: projekt/arbeitsstand.md
    summary: >-
      Hält die lokale Korrektur und ihre Grenze für den Arbeitsstand fest.
affected_relations:
  - from: interaktiv/js/main.js
    relation: other
    to: interaktiv/server/runtime.js
    effect: changed
    note: Die Browseroberfläche unterscheidet nicht erreichbare API und verworfene oder serverseitig abgelehnte KI-Antworten besser.
  - from: interaktiv/README.md
    relation: documents
    to: interaktiv/js/main.js
    effect: added
    note: Die Betriebsgrenze der optionalen KI-Funktion wird für lokale und statische Nutzung sichtbar.
possibilities:
  opened:
    - Nutzer können den Fehler als fehlenden Worker oder Projektserver erkennen.
    - Die manuelle Anschlussarbeit bleibt auch bei nicht verfügbarer KI-Funktion explizit ausgewiesen.
  restricted:
    - Die Änderung aktiviert keinen KI-Endpunkt und verändert keine Deployment- oder Datenschutzentscheidung.
  deferred:
