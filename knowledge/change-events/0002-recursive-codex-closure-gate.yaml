schema_version: 1
id: change-recursive-codex-closure-gate
created_at: 2026-07-30
goal: >-
  Das theoriegeleitete Arbeitsprotokoll durch einen projektlokalen Codex-Stop-Hook
  und eine deterministische Prüfung der Ereignisschemata und Wissensintegrität
  als revidierbare technische Abschlussbedingung operationalisieren.
operation: reorganization
scope:
  allowed_files:
    - .codex/hooks.json
    - .codex/hooks/recursive_stop.py
    - .agents/skills/recursive-codex/SKILL.md
    - .agents/skills/recursive-codex/references/closure-gate.md
    - .agents/skills/recursive-codex/scripts/check_recursive_state.py
    - .agents/skills/recursive-codex/scripts/validate_change_event.py
    - knowledge/change-events/0002-recursive-codex-closure-gate.yaml
    - projekt/arbeitsstand.md
  protected_files:
    - manuskript/
    - GLOSSAR.md
    - PROJECT.md
basis:
  project_files:
    - AGENTS.md
    - WORKFLOW.md
    - .agents/skills/recursive-codex/SKILL.md
  decisions:
    - decision-0021
  sources:
    - "Codex manual: project configuration, hooks, Stop event"
changes:
  - file: .codex/hooks.json
    summary: Projektlokalen Stop-Hook mit plattformspezifischem Startbefehl konfiguriert.
  - file: .codex/hooks/recursive_stop.py
    summary: Dünnen read-only Hook-Adapter mit begrenzter Fortsetzung und Selbsttest angelegt.
  - file: .agents/skills/recursive-codex/SKILL.md
    summary: Projektweite Abschlussprüfung und ihre ausgewiesene Reichweitengrenze integriert.
  - file: .agents/skills/recursive-codex/references/closure-gate.md
    summary: Prüfregeln, Wahrheitstabelle, Vertrauensvoraussetzungen und zurückgestellte Abdeckung dokumentiert.
  - file: .agents/skills/recursive-codex/scripts/check_recursive_state.py
    summary: Deterministische CLI-Prüfung für Ereignisschemata und Wissensintegrität angelegt.
  - file: .agents/skills/recursive-codex/scripts/validate_change_event.py
    summary: Vergleich des deutschen Zielplatzhalters korrigiert.
  - file: knowledge/change-events/0002-recursive-codex-closure-gate.yaml
    summary: Technische Reorganisation und ihre Grenzen dokumentiert.
  - file: projekt/arbeitsstand.md
    summary: Getesteten Phase-2-Stand und noch erforderliche Hook-Aktivierung festgehalten.
affected_relations:
  - from: .codex/hooks.json
    relation: depends_on
    to: .codex/hooks/recursive_stop.py
    effect: added
    note: Der Projekt-Hook ruft den read-only Adapter beim Stop-Ereignis auf.
  - from: .codex/hooks/recursive_stop.py
    relation: depends_on
    to: .agents/skills/recursive-codex/scripts/check_recursive_state.py
    effect: added
    note: Lifecycle-Integration und deterministische Projektprüfung bleiben getrennt.
  - from: .agents/skills/recursive-codex/scripts/check_recursive_state.py
    relation: tests
    to: knowledge/change-events/
    effect: added
    note: Ereignisschemata und Wissensintegrität werden getrennt und mechanisch geprüft.
  - from: .agents/skills/recursive-codex/SKILL.md
    relation: documents
    to: .agents/skills/recursive-codex/references/closure-gate.md
    effect: added
    note: Der Skill verweist auf Reichweite und Grenzen des technischen Gates.
possibilities:
  opened:
    - Fehlgeschlagene Abschlussprüfungen können vor dem Ende eines Codex-Turns höchstens einen weiteren Prüfgang anfordern.
    - Dieselbe Zustandsprüfung kann unabhängig vom Hook lokal und später in CI ausgeführt werden.
  restricted:
    - Der Hook darf keine Manuskriptentscheidung treffen und keine Datei selbst verändern.
    - Eine zweite automatische Fortsetzung wird vermieden, damit kein Endloslauf entsteht.
    - Die Prüfung behauptet keine philosophische Vollständigkeit der dokumentierten Beziehungen.
  deferred:
    - Deklarative Abdeckung struktureller Git-Änderungen bis zur Bestimmung von Baseline, aktivem Ereignis und relationspflichtigen Dateien.
    - MCP-basierter Anschlussgraph.
    - Eigene Oberfläche über Codex SDK oder App Server.
uncertainties:
  - Die Hook-Definition muss nach jeder Änderung einmalig vom Benutzer als vertrauenswürdig bestätigt werden.
  - Andere Stop-Hooks oder verwaltete Codex-Richtlinien können die angeforderte Fortsetzung überstimmen.
  - Je nach Codex-Oberfläche kann ein Neustart oder eine neue Sitzung zur Aktivierung erforderlich sein.
agent_findings:
  genealogist: []
  consistency_checker: []
  critic:
    - Ein syntaktischer Checker kann keine vollständige philosophische Relationsprüfung garantieren; die technische Reichweite wurde deshalb enger ausgewiesen.
    - Ereignisschema, Wissensvalidierung und eine mögliche spätere Abdeckungsregel bleiben getrennte Prüfdimensionen.
  material_technical:
    - Stop-Hook-Eingabe und -Ausgabe müssen genau dem JSON-Vertrag folgen; der Adapter gibt auf stdout nur ein JSON-Objekt aus.
    - Git-Root-Auflösung, commandWindows, Python ohne Bytecode-Schreibzugriff und eine begrenzte Fortsetzung sind für Windows und Schleifensicherheit erforderlich.
    - Projektvertrauen und Vertrauen in die konkrete Hook-Definition sind getrennte Aktivierungsvoraussetzungen.
authority:
  requires_author_decision: true
  decision_status: accepted
  decision_reference: user-instruction-2026-07-30
validation:
  - check: Skill-Struktur
    result: passed
    evidence: quick_validate.py meldet Skill is valid.
  - check: Ereignisvalidator-Selbsttest
    result: passed
    evidence: validate_change_event.py --self-test meldet SELF-TEST PASSED.
  - check: Zustandsprüfer-Selbsttest
    result: passed
    evidence: check_recursive_state.py --self-test meldet SELF-TEST PASSED.
  - check: Hook-Adapter-Selbsttest
    result: passed
    evidence: recursive_stop.py --self-test bestätigt genau eine mögliche Fortsetzung.
  - check: Gültiges Stop-Ereignis
    result: passed
    evidence: Hook antwortet aus Projektwurzel und Unterverzeichnis mit genau einem gültigen JSON-Objekt.
  - check: Windows-Startbefehl
    result: passed
    evidence: commandWindows funktioniert aus interaktiv/ trotz Leerzeichen im Repositorypfad.
  - check: Fehlerroute
    result: passed
    evidence: Ungültiges Hook-JSON erzeugt eine blockierende JSON-Antwort statt Klartext oder stiller Freigabe.
  - check: Wissensintegrität
    result: warning
    evidence: Validierung besteht; 24 bereits vorhandene undeclared-concept-Referenzen bleiben als Warnungen sichtbar.
status: tested
