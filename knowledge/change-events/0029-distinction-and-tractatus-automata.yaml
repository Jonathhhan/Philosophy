    note: Die Tractatus-Form wird als Ordnungsform begrenzt, nicht als Stilimitat oder Theorieautorität.
possibilities:
  opened:
    - Unterscheidungen können als markierte und unmarkierte Seiten geprüft werden.
    - Themen können als nummerierte Satzgefüge vorbereitet werden.
    - Beide Ausgaben können später in den interaktiven Teil oder in Vorschlagsdossiers überführt werden.
  restricted:
    - Keine neue Grundachse des Manuskripts wird stabilisiert.
    - Die Werkzeuge schreiben nicht automatisch ins Manuskript.
    - Spencer Brown und Tractatus-Form werden nicht als Quellenbeleg ohne gesonderte Lektüre eingesetzt.
  deferred:
