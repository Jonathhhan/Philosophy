goal: >-
  Zwei lesende philosophische Automaten ergänzen: einen Codex-Automaten der
  Unterscheidung nach markierter und unmarkierter Seite sowie einen
  Tractatus-philosophicus-Automaten für nummerierte propositionale Prüfstrukturen.
