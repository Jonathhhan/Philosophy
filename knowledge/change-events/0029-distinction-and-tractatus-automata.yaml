changes:
  - file: scripts/unterscheidungsautomat.py
    summary: >-
      Ergänzt eine lesende Analyse markierter und unmarkierter Seiten einer
      Unterscheidung mit Concept-Adressen, Manuskriptankern, Warnungen und Grenzen.
  - file: scripts/tractatus_automat.py
    summary: >-
      Ergänzt eine nummerierte propositionale Prüfstruktur zu einem Thema mit
      Begriffsadressen, Manuskriptankern und Grenzhinweisen.
  - file: projekt/automaten.md
    summary: >-
      Dokumentiert Zweck, Beispiele und Grenzen der beiden neuen Automaten.
  - file: README.md
    summary: >-
      Verweist auf die neuen Automaten und ihre Projektdokumentation.
  - file: projekt/arbeitsstand.md
    summary: >-
      Hält die Automaten als lesende Prüf- und Ordnungsformen fest.
  - file: recovered/proposals/unterscheidung-algorithmus-ausfuehrung.md
    summary: >-
      Speichert eine Beispielausgabe des Unterscheidungsautomaten.
  - file: recovered/proposals/tractatus-anschlussmoeglichkeiten.md
    summary: >-
      Speichert eine Beispielausgabe des Tractatus-Automaten.
