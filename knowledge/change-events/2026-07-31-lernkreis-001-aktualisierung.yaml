possibilities:
  opened:
    - Weitere Lernkreise können intendierten Anschluss, Vollzug, Analyseebene und anschlusswirksame Folge getrennt protokollieren.
  restricted:
    - Tool-Aufrufe dürfen nicht pauschal als Bestätigung oder Anwendung der Leitthese behandelt werden.
  deferred:
    - Eine Präzisierung von Kapitel 5 zur Relevanzschwelle und Analyseebene bleibt Autorenentscheidung.
uncertainties:
  - Offen ist, ob die Irritation eine Manuskriptlücke oder nur eine Grenze technischer Übertragung bezeichnet.
agent_findings:
  genealogist: []
  consistency_checker:
    - Technische Vorgänge sind nur dann Aktualisierungen im Manuskriptsinn, wenn ein bestimmter Vollzug zustande kommt und anschlusswirksam wird.
    - Erfolg, Fehler und No-op fallen nicht mit Aktualisierung und Nichtaktualisierung zusammen.
  critic:
    - Eine beliebig feine Analyseebene könnte stets irgendeine Zustandsdifferenz finden und die Leitthese dadurch trivialisieren.
    - Der Befund begründet zunächst eine Anwendungsgrenze, nicht die Widerlegung der Leitthese.
  material_technical: []
montage:
