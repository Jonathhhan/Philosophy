possibilities:
  opened:
    - Konstitutiver Kern und konkrete Wirkungsbehauptung können getrennt geprüft werden.
  restricted:
    - Die Leitthese kann nicht mehr stillschweigend als empirisches Universalgesetz oder allgemeine Metaphysik gelesen werden.
  deferred:
    - Eine allgemeine Modalontologie und eine bereichsübergreifende Universalbehauptung bleiben außerhalb des Projekts.
uncertainties: []
agent_findings:
  genealogist: []
  consistency_checker:
    - Die systematische Vorprüfung empfiehlt A+ als konsistenteste Fassung des bestehenden Manuskriptzusammenhangs.
  critic:
    - Die Integration muss konstitutiven Kern und fallbezogene Prüfkriterien ausdrücklich auseinanderhalten.
  material_technical: []
montage:
