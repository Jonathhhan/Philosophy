    rejected:
      - variant: project-only
        reason: Der philosophische Status bliebe im argumentierenden Manuskript und in der Definition zu leicht überlesbar.
    deferred: []
  arrangement:
    - position: 1
      variant: coordinated-minimal-integration
      target: PROJECT.md
      function: Status der Leitthese projektweit bestimmen.
    - position: 2
      variant: coordinated-minimal-integration
      target: manuskript/05-aktualisieren.md
      function: Konstitutiven Kern und sachhaltige Prüfanforderung argumentativ unterscheiden.
    - position: 3
      variant: coordinated-minimal-integration
      target: GLOSSAR.md
      function: Rekonstruktionspflicht ergänzen, ohne die Definition zu ersetzen.
  feedback:
    - subject: integrierte Fassung
      finding: Die drei Ergänzungen erfüllen getrennte Funktionen und stimmen in Status, Prüfkriterien und Reichweite überein.
      consequence: preserve
    - subject: geschützte Querverweise
      finding: Kapitel 1, 4, 17 und Schluss widersprechen A+ nicht und benötigen keine Folgeänderung.
      consequence: preserve
