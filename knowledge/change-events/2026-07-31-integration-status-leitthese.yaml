    evidence:
      - Autorenentscheidung ist als decision-0026 dokumentiert.
      - Projektstatus, Kapitelargument und Glossardefinition sind konsistent integriert.
      - Projektweite Validierung und rekursive Abschlussprüfung sind bestanden.
  recovery:
    baseline: git:75408ee
    strategy: Inhaltliche Integration bleibt in einem eigenen Commit vollständig revidierbar.
    verification: Diff, Querverweise, Wissensbasis und Repository wurden vor Stabilisierung erfolgreich geprüft.
