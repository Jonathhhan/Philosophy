        - current-theory
      artifact_or_diff: Nur PROJECT.md präzisieren.
      status: rejected
    - id: coordinated-minimal-integration
      derived_from:
        - accepted-a-plus
        - current-theory
      artifact_or_diff: PROJECT.md, Kapitel 5 und Glossar mit kleinsten hinreichenden Ergänzungen koordinieren.
