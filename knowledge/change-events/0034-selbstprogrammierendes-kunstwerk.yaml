    - Spaetere interaktive Umsetzungen koennen den Score als Ablauf sichtbar machen.
  restricted:
    - Der Automat veraendert nicht selbst seinen Quellcode und schreibt nicht ins Manuskript.
    - Die letzte Station ist eine Abbruchbedingung, keine letzte philosophische Wahrheit.
    - Ausgaben bleiben Auffuehrungsspuren ohne Theorieautoritaet.
