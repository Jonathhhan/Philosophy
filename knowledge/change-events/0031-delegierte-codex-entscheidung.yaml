schema_version: 1
id: change-0031-delegierte-codex-entscheidung
created_at: 2026-07-30
goal: >-
  Eine optionale, ausdrücklich aktivierbare delegierte Codex-Entscheidung
  ermöglichen, ohne die letzte Autorverantwortung, Projektverfassung oder
  Schutzgrenzen zu ersetzen.
operation: reorganization
scope:
  allowed_files:
    - CONSTITUTION.md
    - AGENTS.md
    - WORKFLOW.md
    - projekt/codex-methode-verfeinerung.md
    - projekt/arbeitsstand.md
    - knowledge/decisions/0023-delegierte-codex-entscheidung.yaml
    - knowledge/change-events/0031-delegierte-codex-entscheidung.yaml
    - .agents/skills/recursive-codex/SKILL.md
    - .agents/skills/recursive-codex/references/change-event-schema.md
    - .agents/skills/recursive-codex/scripts/validate_change_event.py
  protected_files:
    - manuskript/
    - knowledge/concepts/
    - sources/
basis:
  project_files:
    - CONSTITUTION.md
    - AGENTS.md
    - WORKFLOW.md
    - projekt/codex-methode-verfeinerung.md
    - .agents/skills/recursive-codex/references/change-event-schema.md
  decisions:
    - user-request-optionale-autorenentscheidung-codex-2026-07-30
  sources:
    - user-instruction-2026-07-30
changes:
  - file: CONSTITUTION.md
    summary: >-
      Ergänzt eine optionale Entscheidungsdelegation mit engen Grenzen,
      Dokumentationspflicht und Revisionsrecht des Autors.
  - file: AGENTS.md
    summary: >-
      Ergänzt Arbeitsregeln für delegierte Codex-Entscheidungen und nicht
      delegierbare Bereiche.
  - file: WORKFLOW.md
    summary: >-
      Ergänzt den Workflow um Markierung, Change-Event-Konvention und
      Abschlussberichtspflicht für delegierte Entscheidungen.
  - file: projekt/codex-methode-verfeinerung.md
    summary: >-
      Ergänzt den Status `delegierte_codex_entscheidung` und eine eigene
      Delegationssektion.
  - file: .agents/skills/recursive-codex/SKILL.md
    summary: >-
      Aktualisiert Abschlussprüfung und Vorgehen bei erlaubter delegierter
      Codex-Entscheidung.
  - file: .agents/skills/recursive-codex/references/change-event-schema.md
    summary: >-
      Dokumentiert `decision_status: delegated` als erlaubten Status.
  - file: .agents/skills/recursive-codex/scripts/validate_change_event.py
    summary: >-
      Erlaubt `delegated` als Entscheidungsstatus für stabilisierte Ereignisse
      mit erforderlicher Autorenentscheidung.
  - file: knowledge/decisions/0023-delegierte-codex-entscheidung.yaml
    summary: >-
      Dokumentiert die Autorenentscheidung zur optionalen Delegation.
  - file: projekt/arbeitsstand.md
    summary: >-
      Hält die neue Delegationsregel, ihre Grenzen und Prüfungen fest.
affected_relations:
  - from: CONSTITUTION.md
    relation: constrains
    to: AGENTS.md
    effect: changed
    note: Codex kann nur bei ausdrücklich erlaubter Delegation entscheiden und bleibt an Schutzgrenzen gebunden.
  - from: CONSTITUTION.md
    relation: constrains
    to: WORKFLOW.md
    effect: changed
    note: Der Workflow übernimmt die Markierungs- und Dokumentationspflicht.
  - from: .agents/skills/recursive-codex/scripts/validate_change_event.py
    relation: tests
    to: .agents/skills/recursive-codex/references/change-event-schema.md
    effect: changed
    note: Validator und Schema kennen nun den Status delegated.
  - from: knowledge/decisions/0023-delegierte-codex-entscheidung.yaml
    relation: documents
    to: CONSTITUTION.md
    effect: added
    note: Die neue Entscheidungsdatei dokumentiert die Autorisierung und Grenzen der optionalen Delegation.
possibilities:
  opened:
    - Codex kann in klar begrenzten Fällen lokale Integrations- oder Priorisierungsentscheidungen übernehmen.
    - Change Events können direkte Autorentscheidungen und delegierte Codex-Entscheidungen unterscheiden.
    - Arbeitsabläufe werden flüssiger, ohne Schutzgrenzen unsichtbar zu machen.
  restricted:
    - Neue Grundbegriffe, Grundthesen, Theorieachsen und Kapitelumordnungen bleiben nicht delegiert.
    - Quellenbehauptungen, Datenschutz, Lizenz, Deployment und öffentliche Veröffentlichung bleiben separat zu autorisieren.
    - Bei mehreren philosophisch gleich starken Lösungen muss Codex Varianten markieren oder zurückfragen.
  deferred:
    - "TODO: Interaktive Visualisierung der optionalen Delegation im Anschlusslabor bleibt spätere Arbeit."
uncertainties: []
