possibilities:
  opened:
    - Ein Gedanke kann in einem Lauf unterschieden, propositional geordnet und als Score aufgefuehrt werden.
    - Nicht anschlussfaehige Kombinationen werden als Blockaden sichtbar statt erfunden.
    - Der Verbund kann spaeter im interaktiven Teil visualisiert werden.
  restricted:
    - Der Verbund schreibt nicht ins Manuskript.
    - Nur ausgewiesene Anschlussbruecken aktivieren eine Kombination.
    - Die Ausgabe bleibt Proposal, Pruefstruktur oder Auffuehrungsspur.
