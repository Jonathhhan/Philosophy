schema_version: 1
id: change-kollektiv-automat
created_at: 2026-07-31
goal: Einen nicht-majoritären Kollektiv-Automaten für rollengetrennte Prüfung, erhaltenen Dissens und operative Redaktionsempfehlungen ergänzen.
operation: reorganization
scope:
  allowed_files:
    - scripts/kollektiv_automat.py
    - scripts/check_all.py
    - tests/test_automata.py
    - projekt/automaten.md
    - knowledge/change-events/2026-07-31-kollektiv-automat.yaml
  protected_files:
    - CONSTITUTION.md
    - PROJECT.md
    - GLOSSAR.md
    - knowledge/concepts/
    - manuskript/
basis:
  project_files:
    - CONSTITUTION.md
    - PROJECT.md
    - GLOSSAR.md
    - projekt/automaten.md
    - projekt/philosophie-automat.md
    - scripts/philosophie_automat.py
  decisions: []
  sources:
    - author-confirmation-kollektiv-automat-2026-07-31
changes:
  - file: scripts/kollektiv_automat.py
    summary: Ergänzt ein lokales Kollektiv mit sechs getrennten Prüfrollen, gemeinsamem Evidenzraum, erhaltenem Dissens und fünf operativen Empfehlungen.
  - file: tests/test_automata.py
    summary: Prüft BLOCKED, FORK, KEEP, PATCH und REORGANIZE sowie Grenzvorrang und Dissensbewahrung.
  - file: projekt/automaten.md
    summary: Dokumentiert Rollen, Vorrangregeln, Aufrufvarianten und Autoritätsgrenzen des Kollektivs.
  - file: knowledge/change-events/2026-07-31-kollektiv-automat.yaml
    summary: Dokumentiert Umfang, Relationsfolgen, Grenzen und Validierung der technischen Reorganisation.
affected_relations:
  - from: scripts/kollektiv_automat.py
    relation: depends_on
    to: scripts/philosophie_automat.py
    effect: added
    note: Die bestehende Begriffs-, Anker- und Grenzprüfung wird rollengetrennt weiterverarbeitet.
  - from: scripts/kollektiv_automat.py
    relation: constrains
    to: manuskript/
    effect: added
    note: Das Kollektiv erzeugt ausschließlich Empfehlungen und nimmt keine Manuskriptintegration vor.
possibilities:
  opened:
    - Mehrere Prüfrollen können denselben Gedanken mit gemeinsamer Evidenz und getrennten Befunden bearbeiten.
    - Abweichende Befunde bleiben als Dissens sichtbar.
    - PATCH, KEEP, BLOCKED, REORGANIZE und FORK werden als operative Empfehlungen unterscheidbar.
  restricted:
    - Keine Mehrheitsentscheidung und kein Ersatz der Autorenentscheidung.
    - Keine automatische Manuskriptänderung.
  deferred:
    - Externe generative Modelle und Netzwerkaufrufe bleiben außerhalb dieses lokalen Kollektivs.
uncertainties: []
agent_findings:
  genealogist:
    - Das Kollektiv verwendet nur deklarierte lokale Quellen und Manuskriptanker; maschinelle Evidenz bleibt von theoretischer Bestätigung getrennt.
  consistency_checker: []
  critic:
    - Eine regelgebundene Empfehlung darf Dissens weder zählen noch als Konsens ausgeben.
  material_technical:
    - Die bestehende Begriffs-, Anker- und Grenzprüfung kann ohne externes Modell als gemeinsamer Evidenzraum wiederverwendet werden.
authority:
  requires_author_decision: false
  decision_status: not_required
  decision_reference: null
validation:
  - check: Automaten-Regressionstests
    result: passed
    evidence: python -m unittest tests/test_automata.py; 10 tests passed
  - check: Reale Kollektivläufe
    result: passed
    evidence: BLOCKED, FORK, KEEP und PATCH über CLI geprüft; REORGANIZE durch reine Entscheidungsregel getestet
  - check: Vollständige Projektprüfung
    result: passed
    evidence: python scripts/check_all.py; 38/38 Change Events, MCP-Graph, Hooks, 20 JavaScript-Tests und Build bestanden
status: stabilized
