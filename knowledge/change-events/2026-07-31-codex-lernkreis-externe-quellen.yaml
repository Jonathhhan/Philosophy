    - Lu et al., Do We Learn From Each Other, 2025, nur Abstract geprüft
changes:
  - file: recovered/audits/codex-theorie-lernkreis-externe-quellen-2026-07-31.md
    summary: Quellenbefunde, Seitenangaben, tragfähige Anschlüsse, Gegenbefunde und offene Volltextprüfungen für fünf externe Publikationen dokumentiert.
  - file: projekt/codex-theorie-lernkreis.md
    summary: Vier externe Vergleichskontexte mit ihren Teilanschlüssen und Nichtübertragbarkeiten in das Arbeitsprinzip aufgenommen.
affected_relations:
  - from: externe Quellen
    relation: sourced_from
    to: projekt/codex-theorie-lernkreis.md
    effect: added
    note: Begrenzte Affinitäten und Nichtübertragbarkeiten werden mit Seitenangaben ausgewiesen.
  - from: recovered/audits/codex-theorie-lernkreis-externe-quellen-2026-07-31.md
    relation: documents
    to: projekt/codex-theorie-lernkreis.md
    effect: added
    note: Quellenbefund, Anschluss, Grenze und offene Volltextprüfungen bleiben getrennt dokumentiert.
possibilities:
  opened:
    - Der Lernkreis kann gegenüber Kybernetik zweiter Ordnung, Conversation Theory und Human-AI-Forschung präzise verortet werden.
  restricted:
    - Externe Wortähnlichkeit darf nicht als Begründung symmetrischen, subjektförmigen oder trainingsbezogenen Codex-Lernens gelten.
  deferred:
    - Pasks Originaltext und der Volltext von Lu et al. benötigen weitere Zugriffs- und Seitenprüfung.
uncertainties:
  - Die externe Genealogie bleibt plural; keine Quelle begründet den Lernkreis als zusammenhängende Theorie.
agent_findings:
  genealogist:
    - Von Foerster trägt Reflexivität und fehlenden Außenstandpunkt; Manning trägt Gegenprüfung und how/why-Differenz; Wang und Chen schärfen als Gegenmodell den Übersetzungsverlust.
  consistency_checker: []
  critic:
    - Asymmetrie, Rückübersetzungssperre und Autorentscheidung sind projektspezifisch und dürfen den Quellen nicht zugeschrieben werden.
    - Shanahan stützt die bestehende Anthropomorphisierungsgrenze und die Unterscheidung von Sprachmodell und eingebettetem System.
  material_technical: []
montage:
  materials:
    - id: learning-principle
      reference: projekt/codex-theorie-lernkreis.md
      kind: manuscript
      status: bestätigtes Projektprinzip
      identity: git:fbfbc95
    - id: external-sources
      reference: vier geprüfte Open-Access-Texte und ein nur abstrakt zugänglicher Artikel
      kind: source
      status: externe Vergleichsquellen
      identity: URLs und PDF-Seiten im Quellenbericht
  variants:
    - id: external-foundation
      derived_from:
        - learning-principle
        - external-sources
      artifact_or_diff: Externe Literatur als Begründung des Lernkreises
      status: rejected
    - id: critical-comparison
      derived_from:
        - learning-principle
        - external-sources
      artifact_or_diff: recovered/audits/codex-theorie-lernkreis-externe-quellen-2026-07-31.md
      status: selected
  selection:
    selected:
      - variant: critical-comparison
        reason: Partielle Affinität, Gegenmodell und Nichtübertragbarkeit bleiben unterscheidbar.
    rejected:
      - variant: external-foundation
        reason: Keine Quelle trägt die asymmetrische Autoritätsordnung und den gesamten Lernkreis.
    deferred: []
  arrangement:
    - position: 1
      variant: critical-comparison
      target: recovered/audits/codex-theorie-lernkreis-externe-quellen-2026-07-31.md
      function: Vollständigen Quellen- und Grenzbefund dokumentieren.
    - position: 2
      variant: critical-comparison
      target: projekt/codex-theorie-lernkreis.md
      function: Verdichtete externe Vergleichskontexte und Grenzen eintragen.
  feedback:
    - subject: Quellenfit-Prüfung
      finding: Die Quellen tragen Teiloperationen, aber keine gemeinsame Fundierung.
      consequence: revise
    - subject: kritische Quellenprüfung
      finding: Human-AI mutual learning ist wegen Modelltraining und symmetrischer Lernsemantik vor allem Gegenmodell.
      consequence: preserve
  stabilization:
    state: stabilized
    evidence:
      - Vier frei zugängliche Volltexte mit PDF-Seiten geprüft.
      - Zwei unabhängige Quellenfit- und Kritikprüfungen integriert.
      - Vollständige Repository-Prüfung, 20 Webtests und Build bestanden.
  recovery:
    baseline: git:fbfbc95
    strategy: Quellenrevision bleibt in einem eigenen Commit revidierbar.
    verification: Event, Links, Seitenangaben, Diff und vollständiger Repository-Zustand sind geprüft.
