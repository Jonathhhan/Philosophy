possibilities:
  opened:
    - Der normative Teil kann Verantwortung und Antwortfähigkeit verwenden, ohne voraussetzungslose Autorschaft zu unterstellen.
    - Kapitel 15 bereitet die Schlussgrenze zur Subjektformfrage besser vor.
  restricted:
    - Es wird keine allgemeine Subjekttheorie eingeführt.
    - Verantwortung wird nicht in Organisation aufgelöst oder abgeschwächt.
    - Kapitel 14, 16, 17 und Schluss bleiben unverändert.
