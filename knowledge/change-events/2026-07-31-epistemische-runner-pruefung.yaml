    - Bindungseinträge können aufgelöst oder supersediert werden.
    - Artefakte können zwischen Jobs anhand eines Manifests verifiziert werden.
  restricted:
    - Unbekannte Schemafelder werden abgewiesen.
    - Ein formal neues Objekt gilt nicht automatisch als philosophisch produktiv.
  deferred:
    - Required Branch Checks müssen mit administrativ authentifiziertem GitHub-Zugang aktiviert werden.
    - Empirische Mehrfachläufe benötigen einen vollständig konfigurierten Modellprovider.
