possibilities:
  opened:
    - Codex kann künftige Arbeiten genauer als Fortsetzung, Einschub, Seitenzweig oder Rückverweis führen.
    - Überraschende entfernte Anschlüsse werden erwünscht, müssen aber als Relation ausgewiesen werden.
    - Das Register kann als Eingang in mehrere Lesemodi dienen, ohne selbst zur Systemordnung zu werden.
  restricted:
    - Luhmann wird nicht als Manuskriptautorität oder neue Grundachse stabilisiert.
    - Bloße Assoziationen bleiben TODO und dürfen nicht als Argument gelten.
    - Umnummerierung oder Löschung wird nicht als Standardreparatur verwendet.
