  - file: projekt/codex-methode-verfeinerung.md
    summary: >-
      Ergaenzt die Codex-Methode um genetische Anschlussarbeit und nummeriert
      die folgenden Abschnitte neu.
  - file: projekt/codex-zettelregister.md
    summary: >-
      Ergaenzt Z-0005 als Registeradresse fuer das genetische Arbeitsprinzip.
  - file: projekt/arbeitsstand.md
    summary: >-
