possibilities:
  opened:
    - Gedanken koennen als Abstammungslinien mit Eltern, Mutation und Nachkommen verfolgt werden.
    - Varianten und automatische Vorschlaege koennen genauer von bestaetigter Theorie unterschieden werden.
    - Spaetere Manuskript- oder Technikarbeit kann ihre Herkunft besser ausweisen.
  restricted:
    - Das genetische Register ist kein Manuskriptbestandteil und keine biologische oder evolutionstheoretische These.
    - Es darf keine Quellenbehauptungen ohne erneute Quellenpruefung erzeugen.
    - Es ersetzt weder Zettelkasten, Plateau-Prinzip noch Autorenentscheidung.
  deferred:
    - "TODO: Technische Auswertung oder Visualisierung genetischer Eintraege bleibt spaetere Arbeit."
    - "TODO: Konkrete genetische Eintraege fuer bestehende Gedankenlinien nur bei Bedarf anlegen."
