id: verteilen
label: Verteilen
status: core
chapter: 12
definition: Anschlussbedingungen innerhalb einer Organisation verschiedenen Positionen so zuordnen, dass Möglichkeiten, Mittel, Belastungen und Entscheidungschancen unterschiedlich wirksam werden.
depends_on:
  - organisieren
required_for:
  - asymmetrie
related: []
constraints:
  - Unterschiedliche Verteilung ist nicht schon Asymmetrie oder normative Unangemessenheit.
  - Möglichkeiten werden nicht als fertig vorliegende Güter verteilt; ihre praktische Wirksamkeit verändert sich mit der Zuordnung ihrer Bedingungen.
