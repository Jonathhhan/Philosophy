id: decision-0012
date: 2026-07-29
title: Algorithmusidentität ist relative strukturelle Identität
status: accepted
decision: >-
  Die Identität eines Algorithmus liegt in der strukturerhaltenden Gleichheit
  seiner spezifizierten Ordnung bedingter Übergänge auf einer ausgewiesenen
  Analyseebene. Verschiedene Darstellungen und Implementierungen können
  denselben Algorithmus realisieren, sofern relevante Zustände, Bedingungen,
  Operationswirkungen und Übergangsrelationen sowie bei stochastischen
  Verfahren die bedingte Auswahlordnung erhalten bleiben. Funktionale
  Austauschbarkeit oder gleiche Ergebnisse genügen nicht. Materielle
  Unterschiede verändern den Algorithmus nur, wenn sie die auf der
  ausgewiesenen Ebene relevante Übergangsordnung verändern.
reason: >-
  Das Kriterium folgt aus der Definition des Algorithmus als Ordnung bedingter
  Übergänge. Es erlaubt verschiedene Notationen und materielle Realisierungen,
  ohne Algorithmusidentität auf Quelltext, Aufgabe oder Ergebnis zu reduzieren.
  Die Angabe der Analyseebene kontrolliert die Abstraktion: Zeit, Speicher,
  Datenrepräsentation, Sensorik oder Fehlerpfade werden algorithmisch relevant,
  sobald sie Bedingungen, Operationen oder Übergänge mitbestimmen.
