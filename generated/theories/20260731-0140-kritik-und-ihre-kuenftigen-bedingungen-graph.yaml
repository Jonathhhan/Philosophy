productive_tensions:
  - programme_offenheit_vs_algorithmische_bestimmtheit
  - improvisation_vs_dauerhafte_verfuegbarkeit
  - urteilskraft_vs_rueckwirkung_des_urteils
  - notwendige_selektion_vs_revisionsfaehiger_ausschluss
  - theorieautonomie_vs_selbstbeobachtung
open_questions:
  - Wann ist ein Anschluss nur plausibel und wann theoretisch notwendig?
  - Kann es Organisation ohne asymmetrische Verteilung von Anschlusschancen geben?
  - Wie lässt sich Anschlussgedächtnis institutionalisieren, ohne Totalprotokollierung zu erzeugen?
  - Welche Maßstäbe begrenzen reorganisierende Kritik, ohne sie auf bestehende Programme zurückzuführen?
  - Wie unterscheiden sich ästhetische, soziale, technische und biologische Anschlussentscheidungen?
revision_conditions:
  - Ein tragfähiges Gegenmodell zeigt Organisation ohne selektive Anschlusswirkung.
  - Urteilsrekursion erweist sich nur als sprachliche Umbenennung bekannter Präzedenzwirkung.
  - Anschlussgedächtnis liefert gegenüber Archiv, Gedächtnis und Pfadabhängigkeit keinen zusätzlichen Erklärungswert.
  - Die Triade Programm, Algorithmus und Improvisation lässt sich nicht konsistent auf Anschlussorganisation beziehen.
