mode: autonomous_theory_generation
status: generated
seed: Kritik verändert nicht nur eine Ordnung, sondern auch die Bedingungen künftiger Kritik.
graph_status: provisional
nodes:
  - id: anschlussentscheidung
    type: concept
    claim: Eine Kritik aktualisiert selektiv einen möglichen Anschluss und macht andere zunächst unwahrscheinlicher.
  - id: anschlussbedingung
    type: concept
    claim: Eine Bedingung, welche Fortsetzungen sichtbar, legitim oder praktisch erreichbar macht.
  - id: organisation
    type: concept
    claim: Stabilisierung ungleicher Wahrscheinlichkeiten möglicher Fortsetzungen.
  - id: kritik
    type: operation
    claim: Beurteilung und mögliche Reorganisation einer Ordnung und ihrer künftigen Anschlussbedingungen.
  - id: korrektive_kritik
    type: distinction
    claim: Verändert Entscheidungen innerhalb eines bestehenden Möglichkeitsraums.
  - id: reorganisierende_kritik
    type: distinction
    claim: Verändert Bedingungen der Bildung, Unterscheidung und Bewertung von Möglichkeiten.
  - id: urteilsrekursion
    type: concept
    claim: Jede Anwendung eines Maßstabs prägt dessen spätere Anwendung und die künftige Urteilslage.
  - id: programm
    type: concept
    claim: Organisiert einen Möglichkeitsraum verfügbarer Operationen, Rollen und Übergänge.
  - id: algorithmus
    type: concept
    claim: Organisiert Verfahren, durch die Möglichkeiten in geregelte Folgen aktualisiert werden.
  - id: improvisation
    type: concept
    claim: Erzeugt Anschlüsse unter nicht vollständig vorwegnehmbaren Bedingungen und verändert dabei sedimentierte Formen.
  - id: revision
    type: operation
    claim: Macht frühere Anschlussentscheidungen und nicht nur ihre Resultate erneut zum Gegenstand.
  - id: revisionsfaehigkeit
    type: property
    claim: Fähigkeit einer Ordnung, Maßstäbe, Verfahren und frühere Auswahlentscheidungen veränderbar zu halten.
  - id: anschlussgedaechtnis
    type: new_concept
    claim: Selektives Gedächtnis gewählter, verworfener und blockierter Fortsetzungen.
  - id: kritik_zweiter_ordnung
    type: concept
    claim: Untersucht, wie Ordnung und Maßstab gemeinsam Anschlussbedingungen hervorbringen.
  - id: organisation_von_moeglichkeiten
    type: central_problem
    claim: Verteilung von Zugängen, Ausschlüssen, Aktualisierungswegen und Revisionschancen.
